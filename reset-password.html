<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="topbar">
  <a class="brand" href="index.html"><span class="bolt"></span> PANEL DIRECTORY</a>
</div>
<div class="wrap" style="max-width:420px;">
  <div class="page-head">
    <h1>Set a new password</h1>
    <div class="sub">This page only works when opened from the reset link in your email.</div>
  </div>
  <div class="board" style="padding:20px;">
    <div class="modal-section">
      <label>New password</label>
      <input type="password" id="newPw">
    </div>
    <div id="msg"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="setBtn">Set password</button>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
document.getElementById("setBtn").addEventListener("click", async () => {
  const pw = document.getElementById("newPw").value;
  const msg = document.getElementById("msg");
  if(!pw || pw.length < 8){ msg.innerHTML = `<div class="err">Use at least 8 characters.</div>`; return; }
  if(!App.sb){ msg.innerHTML = `<div class="err">Supabase isn't configured yet — see README.md.</div>`; return; }
  const { error } = await App.sb.auth.updateUser({ password: pw });
  msg.innerHTML = error
    ? `<div class="err">${App.escapeHtml(error.message)}</div>`
    : `<div class="ok-msg">Password updated — you can close this tab and sign in on any panel page.</div>`;
});
</script>
</body>
</html>
